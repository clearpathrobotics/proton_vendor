name: proton_vendor CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build proton_vendor Source
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/clearpathrobotics/clearpath_docker:jazzy-ci-common-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ros-tooling/action-ros-ci@0.4.8
        id: action_ros_ci_step
        with:
          target-ros2-distro: jazzy
          package-name: |
            proton_vendor
            proton_ros2_interfaces
            proton_ros2_adaptor_generator
            proton_ros2
            proton_ros2_node
          vcs-repo-file-url: dependencies.repos

  build_head:
    name: Build proton_vendor Source with Head Branch
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/clearpathrobotics/clearpath_docker:jazzy-ci-common-latest
    steps:
      - uses: actions/checkout@v7
      - name: "[Repositories Updater] Checkout action"
        uses: actions/checkout@v7
        with:
          repository: clearpathrobotics/repos-dep-update-action
          ref: 0.0.5
          path: repos-dep-update-action
      - name: "[Repositories Updater] Install dependencies"
        run: |
          apt-get update
          apt-get install -y jq git python3 python3-pip
          python3 -m pip install yq --break-system-packages
      - name: "[Repositories Updater] Extract branch name"
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch
      - name: "[Repositories Updater] Run action"
        uses: ./repos-dep-update-action/
        with:
          branch: ${{ steps.extract_branch.outputs.branch }}
          input: dependencies.repos
          output: updated_dependencies.repos
      - name: "[Repositories Updater] Print updated dependencies"
        run: |
          cat updated_dependencies.repos
      - name: "[Proton] Select matching branch"
        id: proton_branch
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          if git ls-remote --exit-code --heads https://github.com/clearpathrobotics/proton.git "$BRANCH" >/dev/null 2>&1; then
            echo "Using matching proton branch: $BRANCH"
            echo "cmake_args=-DPROTON_GIT_TAG=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "No matching proton branch; using default tag"
            echo "cmake_args=" >> "$GITHUB_OUTPUT"
          fi
      - uses: ros-tooling/action-ros-ci@0.4.8
        id: action_ros_ci_step
        with:
          target-ros2-distro: jazzy
          extra-cmake-args: ${{ steps.proton_branch.outputs.cmake_args }}
          package-name: |
            proton_vendor
            proton_ros2_interfaces
            proton_ros2_adaptor_generator
            proton_ros2
            proton_ros2_node
          vcs-repo-file-url: updated_dependencies.repos

  build_base:
    if: github.event_name == 'pull_request'
    name: Build proton_vendor Source with Base Branch
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/clearpathrobotics/clearpath_docker:jazzy-ci-common-latest
    steps:
      - uses: actions/checkout@v7
      - name: "[Repositories Updater] Checkout action"
        uses: actions/checkout@v7
        with:
          repository: clearpathrobotics/repos-dep-update-action
          ref: 0.0.5
          path: repos-dep-update-action
      - name: "[Repositories Updater] Install dependencies"
        run: |
          apt-get update
          apt-get install -y jq git python3 python3-pip
          python3 -m pip install yq --break-system-packages
      - name: "[Repositories Updater] Run action"
        uses: ./repos-dep-update-action/
        with:
          branch: ${{ github.event.pull_request.base.ref }}
          input: dependencies.repos
          output: updated_dependencies.repos
      - name: "[Repositories Updater] Print updated dependencies"
        run: |
          cat updated_dependencies.repos
      - name: "[Proton] Select matching branch"
        id: proton_branch
        shell: bash
        run: |
          BRANCH="${{ github.event.pull_request.base.ref }}"
          if git ls-remote --exit-code --heads https://github.com/clearpathrobotics/proton.git "$BRANCH" >/dev/null 2>&1; then
            echo "Using matching proton branch: $BRANCH"
            echo "cmake_args=-DPROTON_GIT_TAG=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "No matching proton branch; using default tag"
            echo "cmake_args=" >> "$GITHUB_OUTPUT"
          fi
      - uses: ros-tooling/action-ros-ci@0.4.8
        id: action_ros_ci_step
        with:
          target-ros2-distro: jazzy
          extra-cmake-args: ${{ steps.proton_branch.outputs.cmake_args }}
          package-name: |
            proton_vendor
            proton_ros2_interfaces
            proton_ros2_adaptor_generator
            proton_ros2
            proton_ros2_node
          vcs-repo-file-url: updated_dependencies.repos
